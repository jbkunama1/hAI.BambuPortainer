services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:latest
    container_name: bambuddy
    hostname: bambuddy
    pull_policy: always
    networks:
      - highfishNetwork
    ports:
      - "${BAMBU_BUDDY_PORT:-8060}:8109"
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs
      - bambuddy_virtual_printer:/app/data/virtual_printer
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=8109
    healthcheck:
      test: ["CMD", "timeout", "10s", "bash", "-c", ":> /dev/tcp/127.0.0.1/8109 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  highfishNetwork:
    external: true

volumes:
  bambuddy_data:
  bambuddy_logs:
  bambuddy_virtual_printer:
